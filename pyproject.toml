[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphsag"
version = "1.0.0"
description = "Graph-based Security Assurance and Governance kernel for autonomous agents"
requires-python = ">=3.11"
dependencies = ["cryptography>=43,<48"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
